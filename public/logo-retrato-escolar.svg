<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" fill="none" width="100%" height="100%">
  <!-- Viewfinder Icon Container (Left) -->
  <g transform="translate(10, 10)">
    <!-- 4 Corner Focus Brackets -->
    <path d="M 12 32 V 20 C 12 15.5 15.5 12 20 12 H 32" stroke="#F59E0B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 68 12 H 80 C 84.5 12 88 15.5 88 20 V 32" stroke="#F59E0B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 12 68 V 80 C 12 84.5 15.5 88 20 88 H 32" stroke="#F59E0B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 68 88 H 80 C 84.5 88 88 84.5 88 80 V 68" stroke="#F59E0B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Focus Dot -->
    <circle cx="75" cy="24" r="4.5" fill="#F59E0B"/>

    <!-- Student Silhouette -->
    <!-- Torso / Blazer -->
    <path d="M 21 82 C 22 73 28 66 38 64 L 44 68 L 50 72 L 56 68 L 62 64 C 72 66 78 73 79 82 C 77 84 72 85 50 85 C 28 85 23 84 21 82 Z" fill="#0B1727"/>
    <!-- Collar -->
    <polygon points="41,64 50,75 59,64 54,62 50,65 46,62" fill="#FFFFFF"/>
    <!-- Tie Knot & Body -->
    <polygon points="48.5,67 51.5,67 52.5,70 47.5,70" fill="#0B1727"/>
    <polygon points="47.5,70 52.5,70 51.5,80 50,82 48.5,80" fill="#0B1727"/>
    <!-- Neck -->
    <path d="M 44 54 H 56 V 64 C 53 66 47 66 44 64 V 54 Z" fill="#FFFFFF" stroke="#0B1727" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- Ears -->
    <path d="M 33 42 C 30 42 30 49 33 49" stroke="#0B1727" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 67 42 C 70 42 70 49 67 49" stroke="#0B1727" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Face Outline -->
    <path d="M 34 38 C 34 50 40 57 50 57 C 60 57 66 50 66 38" fill="#FFFFFF" stroke="#0B1727" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Hair Silhouette -->
    <path d="M 33 39 C 32 30 36 21 50 21 C 64 21 68 30 67 39 C 65 37 62 33 58 35 C 53 38 49 31 43 32 C 38 33 35 36 33 39 Z" fill="#0B1727"/>
  </g>

  <!-- Typography (Right) -->
  <g transform="translate(130, 0)">
    <!-- "Retrato" in #0B1727, "Escolar" in #F59E0B -->
    <text x="0" y="65" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5px">
      <tspan fill="#0B1727">Retrato</tspan><tspan fill="#F59E0B">Escolar</tspan>
    </text>

    <!-- .COM.AR Pill Badge -->
    <g transform="translate(305, 34)">
      <rect x="0" y="0" width="88" height="34" rx="10" fill="none" stroke="#F59E0B" stroke-width="2.5"/>
      <text x="44" y="23" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#F59E0B" text-anchor="middle" letter-spacing="1px">.COM.AR</text>
    </g>

    <!-- Subtitle: "Portal de fotos escolares" -->
    <text x="0" y="93" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="500" fill="#475569" letter-spacing="0.2px">
      Portal de fotos escolares
    </text>
  </g>
</svg>
